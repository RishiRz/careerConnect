version: '3.9'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerconnect-api
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://localhost:27017/careerconnect}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-super-secure-session-secret-change-in-production-min-32-chars}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - careerconnect-net

  redis:
    image: redis:7-alpine
    container_name: careerconnect-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - careerconnect-net

networks:
  careerconnect-net:
    driver: bridge

volumes:
  redis-data:
